# 正則化パラメータ (0.0〜1.0)
lambda: 0.5

# 使用する主成分数
n_components: 3

# ローリングウィンドウ（営業日数）
rolling_window: 60

# 上位・下位何業種をサジェストするか
top_n: 3

# 米国業種ETF (11業種, SPDR系)
us_etfs:
  XLB: Materials
  XLC: Communication
  XLE: Energy
  XLF: Financials
  XLI: Industrials
  XLK: Technology
  XLP: ConsumerStaples
  XLRE: RealEstate
  XLU: Utilities
  XLV: Healthcare
  XLY: ConsumerDiscretionary

# 日本業種ETF (東証上場, TOPIX-17)
jp_etfs:
  1617.T: Foods
  1618.T: EnergyResources
  1619.T: ConstructionMaterials
  1620.T: Chemicals
  1621.T: Pharmaceuticals
  1622.T: Automobiles
  1623.T: SteelNonFerrous
  1624.T: Machinery
  1625.T: ElectronicsPrecision
  1626.T: ITServices
  1627.T: Utilities
  1628.T: Transportation
  1629.T: TradingWholesale
  1630.T: Retail
  1631.T: Banks
  1632.T: FinancialsExBanks
  1633.T: RealEstate
